<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="calculadora">

        <div class="topo">
            <span class="titulo">Calculadora</span>
            <span class="icone">⌘</span>
        </div>

        <div class="visor">
            <div id="operacao">0</div>
            <div id="resultado">0</div>
        </div>

        <div class="botoes">

            <button class="funcao" onclick="limpar()">AC</button>
            <button class="funcao" onclick="apagar()">⌫</button>
            <button class="funcao" onclick="porcentagem()">%</button>
            <button class="operador" onclick="operacao('/')">÷</button>

            <button onclick="numero('7')">7</button>
            <button onclick="numero('8')">8</button>
            <button onclick="numero('9')">9</button>
            <button class="operador" onclick="operacao('*')">×</button>

            <button onclick="numero('4')">4</button>
            <button onclick="numero('5')">5</button>
            <button onclick="numero('6')">6</button>
            <button class="operador" onclick="operacao('-')">−</button>

            <button onclick="numero('1')">1</button>
            <button onclick="numero('2')">2</button>
            <button onclick="numero('3')">3</button>
            <button class="operador" onclick="operacao('+')">+</button>

            <button class="zero" onclick="numero('0')">0</button>
            <button onclick="numero('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>

        </div>

        <div class="rodape">
            Calculadora • HTML + CSS + JavaScript
        </div>

    </main>

    <script src="variaveis.js"></script>

</body>
</html>
